services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      retries: 5

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./synapse:/data:Z

  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro,Z

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data          # volume nomeado: sem :Z
      - caddy_config:/config
    networks:
      default:
        aliases:          # containers resolvem os nomes do lab para o Caddy
          - lab.internal
          - matrix.lab.internal
          - element.lab.internal
          - rtc.lab.internal
          - ooye.lab.internal

  ooye:
    image: sim2kid/ooye-docker:latest
    restart: unless-stopped
    volumes:
      - ./ooye:/data:Z
    environment:
      NODE_EXTRA_CA_CERTS: /data/lab-root-ca.crt   # Node passa a confiar na CA do Caddy

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro,Z
    ports:
      - "7881:7881/tcp"
      - "50100-50200:50100-50200/udp"

  lk-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://rtc.lab.internal/livekit/sfu
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: lab.internal
      SSL_CERT_FILE: /certs/lab-root-ca.crt     # confia na CA do Caddy
    volumes:
      - ./caddy/lab-root-ca.crt:/certs/lab-root-ca.crt:ro,z   # z minúsculo: arquivo usado por 2 containers

volumes:
  caddy_data:
  caddy_config:
